:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#000; --card:#0e0e0e; --card-hi:#161616; --line:#222; --text:#f2f2f2; --muted:#8a8a8a;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{
  font-family:"Minecraft",system-ui,sans-serif;color:var(--text);
  background:var(--bg);
  background-image:radial-gradient(700px 420px at 50% -120px,rgba(255,255,255,.07),transparent 70%);
  background-repeat:no-repeat;
  display:flex;justify-content:center;
  padding:56px 18px 40px;min-height:100vh;
}
main{width:100%;max-width:960px;display:flex;flex-direction:column;align-items:center}
.col{min-width:0}
.handle{margin-top:4px}
.name{line-height:1.1}
.cols{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:1fr;gap:30px;max-width:460px}}
.col h2{font-family:"Minecraft",system-ui,sans-serif;font-weight:400;font-size:15px;letter-spacing:.5px;color:#bdbdbd;margin:0 0 12px 4px}

.logo{width:min(380px,82vw);margin-bottom:36px;height:auto;display:block;filter:drop-shadow(0 8px 30px rgba(255,255,255,.08));user-select:none;-webkit-user-drag:none}
h1{
  font-family:"Minecraft",system-ui,sans-serif;font-weight:400;font-size:clamp(30px,8.5vw,44px);
  margin:22px 0 34px;letter-spacing:2px;color:#fff;text-transform:none;
}

.links{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:12px}
.link{
  --brand:#fff;
  display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--text);
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px 16px;min-height:70px;
  transition:transform .15s ease,background .15s ease,border-color .15s ease;
}
.link:hover{background:var(--card-hi);border-color:#3a3a3a;transform:translateY(-2px)}
.link:active{transform:translateY(0)}
.link:focus-visible{outline:2px solid #fff;outline-offset:3px}
.ico{
  width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:#1c1c1c;border:1px solid #2a2a2a;transition:background .15s ease,border-color .15s ease;
}
.ico svg{width:22px;height:22px;display:block;color:#fff}
.link:hover .ico{background:var(--brand);border-color:var(--brand)}
.txt{flex:1;min-width:0}
.name{display:block;font-weight:400;font-size:17px}
.handle{display:block;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{color:#555;font-size:24px;line-height:1;transition:transform .15s ease,color .15s ease}
.link:hover .arrow{transform:translateX(3px);color:#fff}

.steam   {--brand:#2a475e}
.telegram{--brand:#26a5e4}
.discord {--brand:#5865f2}
.twitch  {--brand:#9146ff}

.minecraft{--brand:#3c8527}
.fstweak{--brand:#b04dff}
.ico img{width:22px;height:22px;display:block;filter:brightness(0) invert(1)}
.ico .fb{font-size:20px;line-height:1}
footer{margin-top:32px;color:#4a4a4a;font-size:13px}

@media (min-width:900px){
  body{padding-top:8vh}
  .logo{width:420px}
}
@media (max-width:380px){
  body{padding-top:36px}
  h1{margin-bottom:26px}
  .link{padding:12px 14px;min-height:64px}
  .name{font-size:16px}
}
