:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#000; --card:#0e0e0e; --card-hi:#161616; --field:#070707; --line:#222; --line-hi:#3a3a3a;
  --text:#f2f2f2; --muted:#8a8a8a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; min-height:100vh; font-family:"Minecraft",monospace; color:var(--text);
  background:var(--bg);
  background-image:radial-gradient(700px 420px at 50% -120px,rgba(255,255,255,.07),transparent 70%);
  background-repeat:no-repeat;
  padding:28px 16px 40px;
}
.wrap{max-width:920px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none;font-size:16px;margin-bottom:18px}
.back:hover{color:#fff}
.back img{width:26px;height:auto}
h1{font-size:32px;line-height:1.2;margin:0 0 18px;color:#fff;font-weight:400;letter-spacing:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.panel h2{font-size:16px;font-weight:400;margin:0 0 12px;color:#bdbdbd;letter-spacing:0}
label.f{display:block;font-weight:400;font-size:16px;margin:0 0 7px;color:#bdbdbd}
input[type=text],select,textarea{
  width:100%; font:inherit; font-size:16px; color:#fff; background:var(--field);
  border:1px solid var(--line-hi); padding:10px 12px; border-radius:10px;
}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{font-family:"Minecraft",monospace;font-size:16px;resize:vertical;min-height:84px;word-break:break-all}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 170px;gap:12px;margin-bottom:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
button{
  font:inherit;font-size:16px;font-weight:400;color:var(--text);cursor:pointer;
  background:#1a1a1a;border:1px solid #2c2c2c;padding:9px 14px;border-radius:10px;
  transition:background .15s ease,border-color .15s ease;
}
button:hover{background:#242424;border-color:#444}
button:active{background:#141414}
button[disabled]{opacity:.4;cursor:not-allowed}
.sym-wrap{position:relative;margin-bottom:8px}
#symBtn{padding:7px 12px}
#symBtn[aria-expanded="true"]{background:#f2f2f2;color:#000;border-color:#f2f2f2}
.sym-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:40;background:#111;border:1px solid var(--line-hi);border-radius:14px;padding:10px;box-shadow:0 18px 40px rgba(0,0,0,.6);width:min(430px,calc(100vw - 48px))}
.sym-pop[hidden]{display:none}
.sym-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.sym-grid button{height:40px;padding:0;font-size:18px;line-height:1;font-family:system-ui,"Segoe UI Symbol","Noto Sans Symbols 2",sans-serif}
.stops{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.stop{display:flex;align-items:center;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:6px}
.stop input[type=color]{width:40px;height:34px;border:1px solid #333;border-radius:8px;padding:0;background:none;cursor:pointer;flex:none;overflow:hidden}
.stop input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.stop input[type=color]::-webkit-color-swatch{border:none;border-radius:7px}
.stop input[type=text]{font-family:"Minecraft",monospace;text-transform:uppercase;max-width:140px;padding:7px 10px}
.stop .role{font-size:16px;color:var(--muted);flex:1;min-width:0}
.stop button{padding:6px 10px}
.hint{color:var(--muted)}
.sc-word{display:inline-block;margin-right:.25em;white-space:nowrap}
.sc{display:inline-block;vertical-align:baseline;line-height:0;position:relative}
.sc-line{position:absolute;left:0}
.sc-in{display:inline-block;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;image-rendering:pixelated}
.sp-row{grid-template-columns:1fr 240px}
.sp-row .stop{padding:6px}
.sp-row .stop input[type=text]{max-width:none;flex:1}
@media(max-width:560px){.sp-row{grid-template-columns:1fr}}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tools button{padding:8px 10px;font-size:16px;white-space:nowrap}
.fmt{display:flex;flex-wrap:wrap;gap:8px}
.fmt button[aria-pressed="true"]{background:#f2f2f2;color:#000;border-color:#f2f2f2}
.tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:4px;width:fit-content;max-width:100%}
.tab{background:transparent;border:none;padding:8px 14px;border-radius:9px;color:var(--muted)}
.tab:hover{background:#1a1a1a;color:#fff;border:none}
.tab[aria-selected="true"]{background:#f2f2f2;color:#000}
.save-row{display:flex;gap:8px;flex-wrap:wrap}
.save-row input{flex:1;min-width:160px}
.save-btn{margin-left:auto;display:inline-flex;align-items:center;gap:7px}
.save-btn img{width:16px;height:16px;display:block}
@media(max-width:700px){.tools{display:grid;grid-template-columns:1fr 1fr;align-items:stretch}#rnd{grid-column:1/-1}.tools button{white-space:normal;line-height:1.2}.save-btn{margin-left:0;grid-column:1/-1;justify-content:center}}
.accent{background:#f2f2f2;color:#000;border-color:#f2f2f2}
.accent:hover{background:#fff;border-color:#fff}
.save-row button{background:#f2f2f2;color:#000;border-color:#f2f2f2}
.save-row button:hover{background:#fff}
.tpl-msg{font-size:16px;color:var(--muted);margin:8px 0 10px;min-height:1em}
.tpl-msg.err{color:#ff6b6b}
.pwrap{position:relative}
.pwrap .preset{width:100%}
.del{position:absolute;top:3px;right:3px;width:20px;height:20px;padding:0;border-radius:6px;font-size:16px;line-height:1;
  background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.25);color:#fff;opacity:.85}
.del.armed{width:auto;padding:0 6px;background:#c0392b;border-color:#c0392b;opacity:1;font-size:16px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg[hidden]{display:none}
.dlg-box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line-hi);border-radius:16px;padding:18px}
.dlg-box h3{margin:0 0 12px;font-size:16px;font-weight:400;color:#fff}
.dlg-err{color:#ff6b6b;font-size:16px;margin:6px 0 0;min-height:1em}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.del:hover{background:#c0392b;border-color:#c0392b;opacity:1}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.preset{padding:0;height:36px;border:1px solid #2a2a2a;border-radius:10px;position:relative;overflow:hidden}
.preset span{position:absolute;inset:auto 0 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px;font-weight:400;background:rgba(0,0,0,.6);color:#fff;padding:2px 0}
.preset:hover{border-color:#fff}

  <div class="dlg-box" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <h3 id="dlgTitle">Сохранить шаблон</h3>
    <input type="text" id="dlgName" maxlength="24" aria-label="Название шаблона">
    <p class="dlg-err" id="dlgErr"></p>
    <div class="dlg-actions">
      <button type="button" id="dlgCancel">Отмена</button>
      <button type="button" id="dlgOk" class="accent">Сохранить</button>
    </div>
  </div>
</div>
<script>
const PRESETS = [
  {n:"Особая",   c:["B04DFF","FF8FE0"]},
  {n:"Закат",    c:["FAE8F3","FF8F5A"]},
  {n:"Пламя",    c:["FFE259","FF7A00","D10000"]},
  {n:"Океан",    c:["00F0FF","0066FF"]},
  {n:"Изумруд",  c:["C6FF8A","1FAA59"]},
  {n:"Лёд",      c:["FFFFFF","9BE7FF","4A9BFF"]},
  {n:"Эндер",    c:["1B0033","8A2BE2","E0B0FF"]},
  {n:"Золото",   c:["FFF6B7","FFC300","B8860B"]},
  {n:"Радуга",   c:["FF4D4D","FFD24D","4DFF88","4DB8FF","B84DFF"]},
  {n:"Легендарная", c:["FFB000","FF6A00"]},
  {n:"Мифическая",  c:["FF3CAC","784BA0","2B86C5"]},
  {n:"Сакура",      c:["FFD1E8","FF7EB9"]},
  {n:"Северное сияние", c:["43E97B","38F9D7","7F7FFF"]},
  {n:"Незер",       c:["FF4E00","7A0000"]},
  {n:"Неон",        c:["00FFF0","FF00E5"]},
  {n:"Киберпанк",   c:["FCEE09","FF2A6D","05D9E8"]},
];
let stops = ["B04DFF","FF8FE0"];
const fmt = {l:false,o:false,n:false,m:false};
const $ = id => document.getElementById(id);

const shade = h => "#"+[1,3,5].map(i=>Math.floor(parseInt(h.slice(i,i+2),16)/4).toString(16).padStart(2,"0")).join("");
const clean = h => (h||"").replace(/[^0-9a-f]/gi,"").slice(0,6).toUpperCase();
const valid = h => /^[0-9A-F]{6}$/.test(h);
const toRgb = h => [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));
const mix = (a,b,t) => { const A=toRgb(a),B=toRgb(b);
  return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join(""); };

function segments(text,n){
  const chars=[...text], parts=n-1, out=[];
  for(let k=0;k<parts;k++){
    const a=Math.round(chars.length*k/parts), b=Math.round(chars.length*(k+1)/parts);
    out.push(chars.slice(a,b).join(""));
  }
  return out;
}

function renderStops(){
  const box=$("stops"); box.innerHTML="";
  stops.forEach((h,i)=>{
    const d=document.createElement("div"); d.className="stop";
    const role = i===0?"Начало":i===stops.length-1?"Конец":"Середина";
    d.innerHTML=`<input type="color" value="#${valid(h)?h:"FFFFFF"}" aria-label="Цвет ${i+1}">
      <input type="text" value="${h}" maxlength="7" aria-label="HEX ${i+1}">
      <span class="role">${role}</span>
      <button aria-label="Удалить цвет ${i+1}" ${stops.length<=minStops()?"disabled":""}>✕</button>`;
    const [pick,hex,,del]=d.children;
    pick.addEventListener("input",()=>{stops[i]=pick.value.slice(1).toUpperCase();hex.value=stops[i];update();});
    hex.addEventListener("input",()=>{const v=clean(hex.value);stops[i]=v;if(valid(v))pick.value="#"+v;update();});
    del.addEventListener("click",()=>{stops.splice(i,1);renderStops();update();});
    box.appendChild(d);
  });
  $("add").disabled = stops.length>=maxStops();
}

const SMALL = {
  a:"ᴀ",b:"ʙ",c:"ᴄ",d:"ᴅ",e:"ᴇ",f:"ꜰ",g:"ɢ",h:"ʜ",i:"ɪ",j:"ᴊ",k:"ᴋ",l:"ʟ",m:"ᴍ",
  n:"ɴ",o:"ᴏ",p:"ᴘ",q:"ǫ",r:"ʀ",s:"ꜱ",t:"ᴛ",u:"ᴜ",v:"ᴠ",w:"ᴡ",x:"x",y:"ʏ",z:"ᴢ",
  "а":"ᴀ","в":"ʙ","е":"ᴇ","ё":"ᴇ","к":"ᴋ","м":"ᴍ","н":"ʜ",
  "о":"ᴏ","р":"ᴘ","с":"ᴄ","ф":"ȹ","х":"x"
};
const convert = t => $("font").value==="small"
  ? [...t.toLowerCase()].map(c=>SMALL[c]||c).join("") : t;

const SC_PIX={
  "ᴀ":[".###.","#...#","#####","#...#","#...#"],
  "ʙ":["####.","#...#","####.","#...#","####."],
  "ᴄ":[".####","#....","#....","#....",".####"],
  "ᴅ":["####.","#...#","#...#","#...#","####."],
  "ᴇ":["#####","#....","####.","#....","#####"],
  "ꜰ":["#####","#....","####.","#....","#...."],
  "ɢ":[".####","#....","#..##","#...#",".####"],
  "ʜ":["#...#","#...#","#####","#...#","#...#"],
  "ɪ":["###",".#.",".#.",".#.","###"],
  "ᴊ":["..###","...#.","...#.","#..#.",".##.."],
  "ᴋ":["#...#","#..#.","###..","#..#.","#...#"],
  "ʟ":["#....","#....","#....","#....","#####"],
  "ᴍ":["#...#","##.##","#.#.#","#...#","#...#"],
  "ɴ":["#...#","##..#","#.#.#","#..##","#...#"],
  "ᴏ":[".###.","#...#","#...#","#...#",".###."],
  "ᴘ":["####.","#...#","####.","#....","#...."],
  "ǫ":[".###.","#...#","#...#","#..#.",".##.#"],
  "ʀ":["####.","#...#","####.","#..#.","#...#"],
  "ꜱ":[".####","#....",".###.","....#","####."],
  "ᴛ":["#####","..#..","..#..","..#..","..#.."],
  "ᴜ":["#...#","#...#","#...#","#...#",".###."],
  "ᴠ":["#...#","#...#","#...#",".#.#.","..#.."],
  "ᴡ":["#...#","#...#","#.#.#","##.##","#...#"],
  "ʏ":["#...#",".#.#.","..#..","..#..","..#.."],
  "ᴢ":["#####","...#.","..#..",".#...","#####"],
  "ȹ":[".###.","#.#.#","#.#.#",".###.","..#.."]
};
const pxUnit=()=>matchMedia("(max-width:560px)").matches?2:3;
function makeGlyph(ch,col,opt){
  const rows=SC_PIX[ch]; if(!rows) return null;
  opt=opt||{}; const u=pxUnit(), w=rows[0].length;
  const outer=document.createElement("span"); outer.className="sc";
  const f=[]; if(opt.bold) f.push(`drop-shadow(${u}px 0 0 ${col})`);
  f.push(`drop-shadow(${u}px ${u}px 0 ${shade(col)})`);
  outer.style.filter=f.join(" ");
  outer.style.marginRight=(opt.bold?2*u:u)+"px";
  if(opt.italic) outer.style.transform="skewX(-12deg)";
  const inner=document.createElement("span"); inner.className="sc-in";
  inner.style.width=(w*u)+"px"; inner.style.height=(5*u)+"px"; inner.style.background=col;
  inner.style.webkitMaskImage=inner.style.maskImage=`url("${glyphSvg(rows)}")`;
  outer.appendChild(inner);
  [["under",opt.underline,`bottom:${-2*u}px`],["strike",opt.strike,`top:${2*u}px`]].forEach(([n,on,pos])=>{
    if(!on) return; const l=document.createElement("span"); l.className="sc-line";
    l.style.cssText=`${pos};height:${u}px;right:${-u}px;background:${col}`; outer.appendChild(l);
  });
  return outer;
}
function glyphSvg(rows){
  let r=""; const w=rows[0].length;
  rows.forEach((row,y)=>[...row].forEach((ch,x)=>{ if(ch==="#") r+=`<rect x='${x}' y='${y}' width='1' height='1'/>`; }));
  return "data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${w} 5' preserveAspectRatio='none' shape-rendering='crispEdges'>${r}</svg>`);
}
const SP_PREFIX="sponsor";
const isSponsor=()=>$("cmd").value==="sponsor";
const minStops=()=>isSponsor()?1:2;
const maxStops=()=>isSponsor()?7:6;
function colorAt(t){
  if(stops.length===1) return "#"+stops[0];
  const seg=t*(stops.length-1), k=Math.min(Math.floor(seg),stops.length-2);
  return mix(stops[k],stops[k+1],seg-k);
}
function shadowFor(col){ return (matchMedia("(max-width:560px)").matches?"2px 2px 0 ":"3px 3px 0 ")+shade(col); }
let lastEndSynced=null;
function syncNickToEnd(force){
  const end=stops[stops.length-1];
  if(!valid(end)) return;
  if(force||end!==lastEndSynced){
    $("nickHex").value=end; $("nickPick").value="#"+end; lastEndSynced=end;
  }
}
function updateSponsor(){
  syncNickToEnd(false);
  const nick=clean($("nickHex").value), okNick=valid(nick), ok=stops.every(valid);
  $("warn").textContent = !ok ? "Каждый цвет должен состоять из 6 символов HEX, например FF8F5A."
    : !okNick ? "Цвет ника должен состоять из 6 символов HEX, например FD2177." : "";
  const p=$("preview"); p.innerHTML="";
  if(!ok||!okNick){ $("out").value=""; return; }
  const letters=[...SP_PREFIX], n=letters.length;
  const cols=letters.map((_,i)=>colorAt(n>1?i/(n-1):0).toUpperCase());
  $("out").value="/sponsor prefix "+cols.map(c=>"{"+c+"}").join("")+" {#"+nick+"}";
  const word=document.createElement("span"); word.className="sc-word"; word.setAttribute("aria-label",SP_PREFIX);
  letters.forEach((c,i)=>{ const g=makeGlyph(SMALL[c],cols[i]); if(g) word.appendChild(g); });
  p.appendChild(word);
  p.appendChild(document.createTextNode(" "));
  const nk=document.createElement("span"); nk.textContent=$("nickName").value||"nickname";
  nk.style.color="#"+nick; nk.style.textShadow=shadowFor("#"+nick); p.appendChild(nk);
}
function applyMode(){
  const sp=isSponsor();
  $("textBlock").hidden=sp; $("fontBlock").hidden=sp; $("fmtBlock").hidden=sp; $("sponsorBlock").hidden=!sp;
  $("colorsLabel").textContent=sp?"Цвета префикса (1–7)":"Цвета";
  $("outNote").textContent=sp
    ? "Префикс sponsor из 7 букв: каждая буква получает свой цвет из градиента, в конце через пробел идёт цвет ника."
    : "Промежуточные цвета делят текст на равные части: каждая часть переливается к следующему цвету.";
  if(sp) syncNickToEnd(true);
  if(!sp){
    if(stops.length<2) stops.push(stops[0]||"FFFFFF");
    if(stops.length>6) stops=stops.slice(0,5).concat(stops[stops.length-1]);
  }
  renderStops(); update();
}
function update(){
  if(isSponsor()) return updateSponsor();
  const text=convert($("txt").value), codes=Object.keys(fmt).filter(k=>fmt[k]).map(k=>"&"+k).join("");
  const ok=stops.every(valid);
  $("warn").textContent = !ok ? "Каждый цвет должен состоять из 6 символов HEX, например FF8F5A."
    : [...text].length < stops.length-1 ? "Текст слишком короткий для такого количества цветов." : "";
  const segs=segments(text,stops.length);
  // output
  let s="";
  segs.forEach((seg,k)=>{ s += `{#${stops[k]}${k===0?">":"<>"}}` + codes + seg; });
  s += `{#${stops[stops.length-1]}<}`;
  // for 2 stops the first tag is ">" already; middle tags use "<>"
  $("out").value = $("cmd").value + s;
  // preview
  const p=$("preview"); p.innerHTML="";
  if(!ok) return;
  segs.forEach((seg,k)=>{
    const ch=[...seg], n=ch.length;
    ch.forEach((c,i)=>{
      const col=mix(stops[k],stops[k+1],n>1?i/(n-1):0);
      const g=makeGlyph(c,col,{bold:fmt.l,italic:fmt.o,underline:fmt.n,strike:fmt.m});
      if(g){ p.appendChild(g); return; }
      const sp=document.createElement("span");
      sp.textContent=c; sp.style.color=col;
      if(fmt.l){
        const u=pxUnit(), sh=shade(col);
        sp.style.textShadow=`${u}px 0 0 ${col}, ${u}px ${u}px 0 ${sh}, ${2*u}px ${u}px 0 ${sh}`;
        sp.style.marginRight=u+"px";
      } else sp.style.textShadow=shadowFor(col);
      if(fmt.o) sp.style.fontStyle="italic";
      const deco=[fmt.n?"underline":"",fmt.m?"line-through":""].filter(Boolean).join(" ");
      if(deco) sp.style.textDecoration=deco;
      p.appendChild(sp);
    });
  });
}

function renderPresets(){
  const box=$("presets");
  PRESETS.forEach(pr=>{
    const b=document.createElement("button"); b.className="preset";
    b.style.background=`linear-gradient(90deg,${pr.c.map(c=>"#"+c).join(",")})`;
    b.innerHTML=`<span>${pr.n}</span>`; b.setAttribute("aria-label","Палитра "+pr.n);
    b.addEventListener("click",()=>{stops=[...pr.c];renderStops();update();});
    box.appendChild(b);
  });
}

function hsl2hex(h,s,l){
  s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return [f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,"0")).join("").toUpperCase();
}
$("rnd").addEventListener("click",()=>{
  const n=Math.random()<.65?2:3, h=Math.random()*360, step=35+Math.random()*70, dir=Math.random()<.5?1:-1;
  stops=Array.from({length:n},(_,i)=>hsl2hex((h+dir*step*i+360)%360,75+Math.random()*25,55+Math.random()*20));
  renderStops();update();
});
$("add").addEventListener("click",()=>{
  if(stops.length>=maxStops())return;
  if(stops.length===1){ stops.push(stops[0]); renderStops(); update(); return; }
  const a=stops[stops.length-2], b=stops[stops.length-1];
  const mid = valid(a)&&valid(b) ? mix(a,b,.5).slice(1).toUpperCase() : "FFFFFF";
  stops.splice(stops.length-1,0,mid); renderStops();update();
});
$("rev").addEventListener("click",()=>{stops.reverse();renderStops();update();});
$("txt").addEventListener("input",update);
$("cmd").addEventListener("change",applyMode);
$("nickPick").addEventListener("input",()=>{ $("nickHex").value=$("nickPick").value.slice(1).toUpperCase(); update(); });
$("nickHex").addEventListener("input",()=>{ const v=clean($("nickHex").value); if(valid(v)) $("nickPick").value="#"+v; update(); });
$("nickName").addEventListener("input",update);
$("font").addEventListener("change",update);
document.querySelectorAll("#fmt button").forEach(b=>b.addEventListener("click",()=>{
  const c=b.dataset.c; fmt[c]=!fmt[c]; b.setAttribute("aria-pressed",fmt[c]); update();
}));
$("copy").addEventListener("click",async()=>{
  const t=$("out");
  try{ await navigator.clipboard.writeText(t.value); }
  catch(e){ t.select(); document.execCommand("copy"); }
  $("copy").textContent="Скопировано"; setTimeout(()=>$("copy").textContent="Скопировать",1400);
});

["✦","★","❖","➤","⚔","❤","•","❀","☆","✧","✪","✯","❂","✿","❁","☘","♛","♚","⚜","☠","⚡","☀","☁","❄","☃","☂","☾","♪","♫","♠","♣","♦","♥","❥","✔","✘","⚠","☢","☣","☯","⚓","⚑","✎","✉","⌛","∞","✚","◇"].forEach(sym=>{
  const b=document.createElement("button"); b.textContent=sym; b.setAttribute("aria-label","Вставить символ "+sym);
  b.addEventListener("click",()=>{
    const t=$("txt"), a=txtTouched?(t.selectionStart??t.value.length):t.value.length, e=txtTouched?(t.selectionEnd??a):a;
    t.value=t.value.slice(0,a)+sym+t.value.slice(e);
    t.focus(); t.setSelectionRange(a+sym.length,a+sym.length); update();
  });
  $("syms").appendChild(b);
});
let txtTouched=false;
["focus","click","keyup"].forEach(ev=>$("txt").addEventListener(ev,()=>{txtTouched=true;}));
function toggleSyms(open){
  const o = open===undefined ? $("symPop").hidden : open;
  $("symPop").hidden=!o; $("symBtn").setAttribute("aria-expanded",o);
}
$("symBtn").addEventListener("click",()=>toggleSyms());
document.addEventListener("mousedown",e=>{
  if($("symPop").hidden) return;
  if(!e.target.closest(".sym-wrap")) toggleSyms(false);
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("symPop").hidden){ toggleSyms(false); $("symBtn").focus(); } });
// ---- Мои шаблоны ----
const TPL_KEY="fspirat_hex_templates";
let mine=[];
try{ mine=JSON.parse(localStorage.getItem(TPL_KEY)||"[]"); if(!Array.isArray(mine)) mine=[]; }catch(e){ mine=[]; }
function saveMine(){ try{ localStorage.setItem(TPL_KEY,JSON.stringify(mine)); return true; }catch(e){ return false; } }
function msg(t,err){ const m=$("tplMsg"); m.textContent=t; m.classList.toggle("err",!!err); }
function renderMine(){
  const box=$("mine"); box.innerHTML="";
  $("mineEmpty").hidden = mine.length>0;
  mine.forEach((pr,idx)=>{
    const w=document.createElement("div"); w.className="pwrap";
    const b=document.createElement("button"); b.className="preset";
    b.style.background=`linear-gradient(90deg,${pr.c.map(c=>"#"+c).join(",")})`;
    const sp=document.createElement("span"); sp.textContent=pr.n; b.appendChild(sp);
    b.setAttribute("aria-label","Шаблон "+pr.n); b.title=pr.n;
    b.addEventListener("click",()=>{stops=[...pr.c];renderStops();update();msg("Применён шаблон «"+pr.n+"»");});
    const d=document.createElement("button"); d.type="button"; d.className="del"; d.textContent="✕";
    d.setAttribute("aria-label","Удалить шаблон "+pr.n);
    let armed=false, timer=null;
    d.addEventListener("click",e=>{
      e.preventDefault(); e.stopPropagation();
      if(!armed){
        armed=true; d.classList.add("armed"); d.textContent="Удалить?";
        timer=setTimeout(()=>{armed=false;d.classList.remove("armed");d.textContent="✕";},3000);
        return;
      }
      clearTimeout(timer);
      mine.splice(idx,1); saveMine(); renderMine(); msg("Шаблон «"+pr.n+"» удалён");
    });
    w.append(b,d); box.appendChild(w);
  });
}
function saveTemplate(name){
  name=(name||"").trim().slice(0,24);
  if(!name){ msg("Введите название шаблона.",true); return false; }
  if(!stops.every(valid)){ msg("Сначала исправьте цвета: каждый должен быть из 6 символов HEX.",true); return false; }
  const i=mine.findIndex(t=>t.n.toLowerCase()===name.toLowerCase());
  const replaced=i>=0;
  if(replaced) mine[i]={n:name,c:[...stops]}; else mine.push({n:name,c:[...stops]});
  const ok=saveMine();
  if(ok) msg(replaced?"Шаблон «"+name+"» обновлён":"Шаблон «"+name+"» сохранён");
  else msg("Не удалось сохранить: браузер запретил хранение данных.",true);
  renderMine(); return ok;
}
$("quickSave").addEventListener("click",()=>{
  if(!stops.every(valid)){ $("warn").textContent="Сначала исправьте цвета: каждый должен быть из 6 символов HEX."; return; }
  $("dlgName").value="Мой шаблон "+(mine.length+1); $("dlgErr").textContent="";
  $("dlg").hidden=false; setTimeout(()=>{$("dlgName").focus();$("dlgName").select();},30);
});
function closeDlg(){ $("dlg").hidden=true; }
function confirmDlg(){
  const name=$("dlgName").value.trim();
  if(!name){ $("dlgErr").textContent="Введите название."; return; }
  if(saveTemplate(name)){
    closeDlg(); setTab("mine");
    const t=$("quickSave").querySelector("span"); t.textContent="Сохранено ✓"; setTimeout(()=>t.textContent="Сохранить шаблон",1500);
  }
}
$("dlgOk").addEventListener("click",confirmDlg);
$("dlgCancel").addEventListener("click",closeDlg);
$("dlg").addEventListener("click",e=>{ if(e.target===$("dlg")) closeDlg(); });
$("dlgName").addEventListener("keydown",e=>{ if(e.key==="Enter") confirmDlg(); if(e.key==="Escape") closeDlg(); });
function setTab(which){
  const r=which==="ready";
  $("tab-ready").setAttribute("aria-selected",r); $("tab-mine").setAttribute("aria-selected",!r);
  $("pane-ready").hidden=!r; $("pane-mine").hidden=r;
}
$("tab-ready").addEventListener("click",()=>setTab("ready"));
$("tab-mine").addEventListener("click",()=>setTab("mine"));
renderMine();
renderPresets(); renderStops(); update();
</script>
