name: Mod screenshots

# Запускает Minecraft с FSTWEAK в виртуальном экране, снимает окна мода для страницы сайта и прогоняет
# проверки в живой игре — на 1.21.11 и на самой новой версии 26.3.
# Результат — артефакты fstweak-screenshots (1.21.11, идут на сайт) и fstweak-screenshots-26.3
# (PNG 1920×1200, интерфейс ×3, русский язык).
on:
  workflow_dispatch:
  push:
    paths:
      - "hexgen-1.21.11/src/gametest/**"
      - "hexgen-26.3/src/gametest/**"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: hexgen-1.21.11
            gradle: "9.2.1"
            artifact: fstweak-screenshots
          - project: hexgen-26.3
            gradle: "9.6.0"
            artifact: fstweak-screenshots-26.3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils

      - name: Take screenshots
        working-directory: ${{ matrix.project }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          # Программная отрисовка забирает не больше двух ядер — остальное серверу мира (иначе «Timeout loading world»).
          LP_NUM_THREADS: "2"
        # Загрузка мира на программной отрисовке иногда не укладывается в лимит — до трёх попыток.
        run: |
          for i in 1 2 3; do
            xvfb-run -a -s "-screen 0 1920x1200x24" gradle runClientGameTest --stacktrace && exit 0
            echo "Attempt $i failed"
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.project }}/build/run/clientGameTest/screenshots/
            ${{ matrix.project }}/build/run/clientGameTest/logs/latest.log

      # Снимки кладутся в эту же ветку в папку .screenshots/ (26.3 — в .screenshots-26.3/; вне sites/ — на деплой
      # не влияют), чтобы их можно было забрать через git и подготовить для сайта.
      - name: Commit screenshots to the branch
        if: github.event_name == 'workflow_dispatch' || github.ref != 'refs/heads/main'
        env:
          DIR: ${{ matrix.project == 'hexgen-1.21.11' && '.screenshots' || '.screenshots-26.3' }}
        run: |
          rm -rf "$DIR" && mkdir -p "$DIR"
          cp ${{ matrix.project }}/build/run/clientGameTest/screenshots/*.png "$DIR/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIR"
          git commit -m "Mod screenshots (${{ matrix.project }}) from CI run ${{ github.run_id }}" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
