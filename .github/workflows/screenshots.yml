name: Mod screenshots

# Запускает Minecraft с FSTWEAK в виртуальном экране и снимает окна мода для страницы сайта.
# Результат — артефакт fstweak-screenshots (PNG 1920×1200, интерфейс ×3, русский язык).
on:
  workflow_dispatch:
  push:
    paths:
      - "hexgen-1.21.11/src/gametest/**"
      - ".github/workflows/screenshots.yml"

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils

      - name: Take screenshots
        working-directory: hexgen-1.21.11
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1920x1200x24" gradle runClientGameTest --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fstweak-screenshots
          path: |
            hexgen-1.21.11/build/run/clientGameTest/screenshots/
            hexgen-1.21.11/build/run/clientGameTest/logs/latest.log
