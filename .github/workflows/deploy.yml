name: Deploy site

on:
  push:
    branches: [main]
    paths: ['sites/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Отметка о выкладке: её показывает вкладка «Сервис» админ-панели.
      - name: Write build stamp
        run: printf '{"sha":"%s","time":%s,"run":"%s"}\n' "$GITHUB_SHA" "$(date +%s)" "$GITHUB_RUN_ID" > sites/fspirat.ru/api/build.json

      - name: Upload to server
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          # router/ — страница роутера из репозитория fspirat-router: её не трогаем и не удаляем.
          # Ключ deploy ограничен rrsync (только выкладка в /var/www/fspirat.online, пути — от этой папки).
          # Пока ограничения нет — полный путь (workflow работает и до, и после включения rrsync).
          if [ "$(ssh -o BatchMode=yes deploy@"$SSH_HOST" echo plain 2>/dev/null)" = plain ]; then D=/var/www/fspirat.online/; else D=; fi
          echo "цель: ${D:-корень rrsync (/var/www/fspirat.online)}"
          # повтор: rrsync не пускает две выкладки одновременно (сайт и страница роутера в одну секунду)
          for i in 1 2 3; do
            rsync -avz --delete --exclude '/router/' ./sites/fspirat.ru/ deploy@"$SSH_HOST":"$D" && break
            [ $i = 3 ] && exit 1; echo "повтор через 20 с"; sleep 20
          done
