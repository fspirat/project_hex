name: Deploy site

# Выкладывает папку website/ на хостинг reg.ru по FTP.
# Запускается, когда изменения в website/ попадают в main, или вручную (Actions → Deploy site → Run workflow).
# Нужные секреты (Settings → Secrets and variables → Actions):
#   FTP_HOST      — адрес FTP-сервера из панели reg.ru
#   FTP_USER      — FTP-пользователь
#   FTP_PASSWORD  — его пароль
#   FTP_DIR       — ./ для FTP-пользователя с домашней папкой /www/fspirat.ru,
#                   или www/fspirat.ru/ для пользователя со всем аккаунтом (слеш в конце обязателен)
#   FTP_PROTOCOL  — необязательно: ftps (по умолчанию) или ftp, если хостинг не поддерживает шифрование
on:
  push:
    branches: [main]
    paths: ["website/**"]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          if [ -z "$FTP_HOST" ]; then
            echo "::error::Секреты FTP_HOST / FTP_USER / FTP_PASSWORD / FTP_DIR не заданы"
            exit 1
          fi
          # FTP_DIR задаётся явно: «./» — если FTP-пользователь видит только папку сайта
          # (u3660418_fspirat → /www/fspirat.ru), «www/fspirat.ru/» — если пользователь видит весь аккаунт.
          case "$FTP_DIR" in
            ""|"/"|".") echo "::error::FTP_DIR не задан: ./ для пользователя с папкой сайта или www/fspirat.ru/ для всего аккаунта"; exit 1 ;;
            */) ;;
            *) echo "::error::FTP_DIR должен заканчиваться на /"; exit 1 ;;
          esac

      # Загружает только изменённые файлы. Чужие файлы на сервере (например hex_generator/) не трогает:
      # удаляются только те, что раньше выкладывал этот же шаг и которые убрали из website/.
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./website/
          server-dir: ${{ secrets.FTP_DIR }}
