name: Build mod

on:
  push:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Опубликовать релиз с этим тегом (например v1.0.0); пусто — только сборка"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: hexgen-1.21.11
            gradle: "9.2.1"
          - project: hexgen-26.2
            gradle: "9.5.1"
          - project: hexgen-26.1.2
            gradle: "9.5.1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Build ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: gradle build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}
          path: ${{ matrix.project }}/build/libs/*.jar

      # Копия с постоянным именем (fstweak-<версия MC>.jar) — на неё ссылается страница fspirat.ru/fstweak/.
      - name: Prepare release file
        run: |
          mkdir -p dist
          jar=$(ls ${{ matrix.project }}/build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          cp "$jar" "dist/fstweak-${MC#hexgen-}.jar"
        env:
          MC: ${{ matrix.project }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.project }}
          path: dist/*.jar

  # Релиз на GitHub: при пуше тега вида v1.0.0 или при ручном запуске с заполненным release_tag
  # (Actions → Build mod → Run workflow).
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: FSTWEAK ${{ inputs.release_tag || github.ref_name }}
          files: dist/*.jar
          generate_release_notes: true
