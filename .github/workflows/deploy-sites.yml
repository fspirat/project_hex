name: Deploy fspirat.ru (reg.ru)

# Выкладывает sites/fspirat.ru/ на хостинг reg.ru по FTP (→ /www/fspirat.ru).
# fspirat.online открывается с GitHub Pages — см. pages.yml.
# Запускается, когда изменения в sites/ попадают в main, или вручную (Actions → Run workflow).
#
# Секреты (Settings → Secrets and variables → Actions):
#   FTP_HOST          — адрес FTP-сервера из панели reg.ru
#   FTP_USER_RU       — FTP-пользователь с домашней папкой /www/fspirat.ru
#   FTP_PASSWORD_RU   — его пароль
#   FTP_PROTOCOL      — необязательно: ftps (по умолчанию) или ftp, если хостинг не поддерживает шифрование
#
# Пользователь видит только папку сайта, поэтому файлы загружаются в его корень (./).
# Загружаются только изменённые файлы; удаляются только те, что раньше выкладывал этот же сценарий
# и которые убрали из репозитория.
on:
  push:
    branches: [main]
    paths: ["sites/**"]
  workflow_dispatch:

concurrency:
  group: deploy-sites
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: fspirat.ru
            key: RU
    steps:
      - uses: actions/checkout@v4

      - name: Check ${{ matrix.site }}
        id: check
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets[format('FTP_USER_{0}', matrix.key)] }}
        run: |
          dir="sites/${{ matrix.site }}"
          if ! find "$dir" -type f ! -name README.md | grep -q .; then
            echo "Своих файлов у ${{ matrix.site }} нет — выкладываю копию fspirat.ru"
            dir="sites/fspirat.ru"
          fi
          echo "dir=./$dir/" >> "$GITHUB_OUTPUT"
          # Сайт без своих FTP-секретов просто пропускается — можно подключать сайты по одному.
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ]; then
            echo "::warning::${{ matrix.site }} пропущен: нет секретов FTP_HOST / FTP_USER_${{ matrix.key }} / FTP_PASSWORD_${{ matrix.key }}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Upload ${{ matrix.site }}
        if: steps.check.outputs.skip != 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets[format('FTP_USER_{0}', matrix.key)] }}
          password: ${{ secrets[format('FTP_PASSWORD_{0}', matrix.key)] }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ${{ steps.check.outputs.dir }}
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            README.md
